spring.application.name=hostel-management

# ==========================================
# MySQL Database Configuration (Cloud & Local Support)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hostel_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Mysqlpog@123}

# Hibernate Configuration (Auto-create/update tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# Legacy H2 Configuration (Commented out)
# ==========================================
# spring.datasource.url=jdbc:h2:file:./data/hosteldb;AUTO_SERVER=TRUE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=password
# spring.h2.console.enabled=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Server Port (Frontend is 3000/3001, let's run Backend on 8080)
server.port=8080

# CORS Global Configuration (Allow React Frontend to access APIs)
# We will handle this in Java config, but good to keep in mind

# Academic year rollover schedule (auto on/off is controlled from Admin → Students tab)
# Cron default: midnight on 1 June each year
hostel.rollover.enabled=false
hostel.rollover.cron=0 0 0 1 6 *
